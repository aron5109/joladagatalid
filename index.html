<!doctype html>
<html lang="is">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4a0f17">
  <title>Jólagleði – jóladagatal starfsfólks</title>
  <meta name="description" content="Sjónræn frumgerð að stafrænu jóladagatali starfsfólks með 24 gluggum.">
  <style>
    :root {
      --wine: #6f1821;
      --wine-deep: #3a0a11;
      --cream: #fff9ed;
      --paper: #f3ead8;
      --cranberry: #9d2933;
      --cranberry-dark: #6f1821;
      --gold: #e6bd62;
      --gold-light: #ffe5a3;
      --ink: #2e1a1b;
      --muted: #76625d;
      --shadow: 0 18px 50px rgb(28 4 8 / 30%);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 16% 8%, rgb(255 205 130 / 16%) 0 9%, transparent 25%),
        radial-gradient(circle at 86% 4%, rgb(255 190 180 / 10%) 0 7%, transparent 23%),
        linear-gradient(160deg, #8e1f2b 0%, #5e121c 52%, #360910 100%);
      font-family: ui-rounded, "Avenir Next", Avenir, "Segoe UI", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    button, a { font: inherit; }
    button { color: inherit; }
    :focus-visible { outline: 3px solid var(--gold-light); outline-offset: 4px; }

    .skip-link {
      position: fixed;
      left: 1rem;
      top: -5rem;
      z-index: 50;
      padding: .7rem 1rem;
      border-radius: .6rem;
      color: var(--wine-deep);
      background: white;
      font-weight: 800;
    }
    .skip-link:focus { top: 1rem; }

    .snow, .snow::before, .snow::after {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgb(255 255 255 / 55%) 0 1.5px, transparent 2px),
        radial-gradient(circle, rgb(255 255 255 / 30%) 0 1px, transparent 1.5px);
      background-size: 110px 110px, 67px 67px;
      background-position: 0 0, 22px 34px;
      opacity: .45;
      content: "";
    }
    .snow::before { transform: translate3d(0, -40px, 0); opacity: .4; }

    .snowfall { position: fixed; inset: 0; z-index: 2; overflow: hidden; pointer-events: none; }
    .flake {
      position: absolute;
      top: -2rem;
      left: var(--x);
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: #fff;
      opacity: var(--alpha);
      filter: blur(var(--blur, 0));
      animation: fall var(--dur) linear var(--delay) infinite;
    }
    .flake.crystal { border-radius: 0; background: none; filter: none; }
    .flake.crystal svg { display: block; width: 100%; height: 100%; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; fill: none; }
    @keyframes fall {
      0% { transform: translate3d(0, 0, 0) rotate(0deg); }
      50% { transform: translate3d(var(--drift), 55vh, 0) rotate(160deg); }
      100% { transform: translate3d(calc(var(--drift) * -.4), calc(100vh + 3rem), 0) rotate(320deg); }
    }

    .site-shell { width: min(1160px, calc(100% - 2rem)); margin: 0 auto; padding: 1rem 0 4rem; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      color: var(--cream);
      margin-bottom: 1.6rem;
    }
    .brand { display: flex; align-items: center; gap: .5rem; font-family: Georgia, "Times New Roman", serif; font-size: 1.35rem; }
    .brand-mark { width: 1.25rem; height: 1.25rem; fill: var(--gold); }
    .prototype-control { display: flex; gap: .25rem; padding: .3rem; border: 1px solid rgb(255 255 255 / 18%); border-radius: 999px; background: rgb(30 4 8 / 30%); }
    .prototype-control span { align-self: center; padding: 0 .5rem; font-size: .85rem; opacity: .8; }
    .prototype-control button { min-width: 2.4rem; border: 0; border-radius: 999px; padding: .5rem .7rem; color: var(--cream); background: transparent; cursor: pointer; }
    .prototype-control button[aria-pressed="true"] { color: var(--wine-deep); background: var(--gold-light); font-weight: 800; }

    .hero {
      --landscape-h: max(7.5rem, min(140px, 15.2vw));
      position: relative;
      padding: 2.4rem 1.2rem calc(var(--landscape-h) + .4rem);
      color: var(--cream);
      text-align: center;
    }
    .eyebrow { margin: 0 0 .6rem; color: var(--gold-light); font-size: 1rem; font-weight: 700; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.7rem, 9vw, 5.7rem); font-weight: 500; line-height: .96; letter-spacing: -.045em; }
    .hero p { max-width: 38rem; margin: 1rem auto 1.5rem; color: rgb(255 249 237 / 78%); font-size: clamp(1rem, 2vw, 1.17rem); line-height: 1.65; }
    .today-button { display: inline-flex; align-items: center; gap: .7rem; border: 1px solid rgb(255 255 255 / 28%); border-radius: 999px; padding: .85rem 1.2rem; color: var(--wine-deep); background: var(--cream); box-shadow: 0 9px 26px rgb(0 0 0 / 18%); font-weight: 850; cursor: pointer; }
    .today-button:hover { background: #fff; }

    .landscape { position: absolute; left: 50%; bottom: -1px; width: min(920px, 100%); height: var(--landscape-h); transform: translateX(-50%); overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); }
    .village { display: block; width: 100%; height: 100%; }
    .village .lit { fill: var(--gold-light); filter: url(#glow); }

    .calendar-card { position: relative; z-index: 3; border: 1px solid rgb(255 255 255 / 55%); border-radius: 2rem; padding: clamp(1rem, 4vw, 2.2rem); background: linear-gradient(145deg, rgb(255 252 245 / 98%), rgb(240 230 210 / 98%)); box-shadow: var(--shadow); }
    .calendar-head { display: flex; justify-content: space-between; align-items: end; gap: 1rem; margin-bottom: 1.6rem; padding: 0 .25rem; }
    .calendar-head h2 { margin: 0 0 .25rem; font-family: Georgia, serif; font-size: clamp(1.5rem, 4vw, 2.25rem); font-weight: 500; }
    .calendar-head p { margin: 0; color: var(--muted); font-size: .93rem; }

    .calendar-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .65rem; }
    .door {
      position: relative;
      min-width: 0;
      min-height: 7.5rem;
      border: 0;
      border-radius: .9rem;
      padding: .8rem;
      overflow: hidden;
      color: var(--cream);
      background: var(--door-bg, #315d50);
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / 12%), 0 3px 0 rgb(50 45 35 / 10%);
      text-align: left;
      cursor: pointer;
      isolation: isolate;
      transition: transform .15s ease;
    }
    .door:hover:not(.locked) { transform: translateY(-3px); }
    .door::before { position: absolute; inset: 7px; z-index: -1; border: 1px dashed rgb(255 255 255 / 22%); border-radius: .65rem; content: ""; }
    .door:nth-child(6n+1) { --door-bg: #a3222d; }
    .door:nth-child(6n+2) { --door-bg: #7b1824; }
    .door:nth-child(6n+3) { --door-bg: #b8873a; }
    .door:nth-child(6n+4) { --door-bg: #c4453a; }
    .door:nth-child(6n+5) { --door-bg: #5e2a35; }
    .door:nth-child(6n) { --door-bg: #8e3a2f; }
    .door .art { position: absolute; right: .2rem; bottom: .2rem; z-index: -1; width: 64%; height: 76%; pointer-events: none; }
    .door .art svg { display: block; width: 100%; height: 100%; }
    .door.has-name .art { bottom: 1.5rem; height: 66%; }
    .door.locked .art { filter: grayscale(1); opacity: .32; }
    .door .lad-name { position: absolute; left: .55rem; bottom: .5rem; max-width: calc(100% - 1.1rem); overflow: hidden; padding: .12rem .42rem; border-radius: .35rem; background: rgb(30 4 8 / 30%); font-size: .78rem; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .door.locked .lad-name { color: #6f6b60; background: rgb(255 255 255 / 45%); }
    .door .number { display: block; font-family: Georgia, serif; font-size: clamp(2.4rem, 7vw, 3.6rem); line-height: 1; }
    .door .status { position: absolute; right: .75rem; top: .7rem; display: grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: rgb(0 0 0 / 20%); font-size: .8rem; font-weight: 800; }
    .door .status svg { width: .8rem; height: .8rem; fill: currentColor; }
    .door.locked { color: #6f6b60; background: #ded7c9; cursor: not-allowed; }
    .door.locked::before { border-color: rgb(45 55 50 / 12%); }
    .door.locked .status { color: #6f6b60; background: transparent; }
    .door.is-today { box-shadow: 0 0 0 4px var(--gold), 0 10px 26px rgb(131 93 29 / 24%); }
    .door.is-today::before { border-style: solid; border-color: var(--gold-light); }
    .today-tag { position: absolute; right: .6rem; top: .6rem; padding: .2rem .5rem; border-radius: .35rem; color: var(--wine-deep); background: var(--gold-light); font-size: .8rem; font-weight: 800; }
    .door.special { grid-column: span 3; min-height: 9rem; color: var(--wine-deep); background: linear-gradient(120deg, #f8d981, #fff0ba 42%, #d8a541); box-shadow: inset 0 0 0 1px rgb(117 69 8 / 20%); }
    .door.special::before { border-color: rgb(116 66 7 / 25%); }
    .door.special .number { font-size: clamp(3rem, 11vw, 5.5rem); }
    .door.special .special-copy { position: absolute; right: 1.1rem; bottom: 1.2rem; max-width: 10rem; font-family: Georgia, serif; font-size: 1.05rem; text-align: right; }
    .door.special .art { right: auto; left: 50%; bottom: .3rem; width: 8rem; height: calc(100% - .6rem); transform: translateX(-50%); }
    .door.special .lad-name { left: .8rem; bottom: .8rem; color: var(--wine-deep); background: rgb(255 255 255 / 45%); font-size: .9rem; }
    .door.special.locked { color: #6f6346; filter: saturate(.55); }

    .footer { padding: 1.5rem .5rem 0; color: rgb(255 249 237 / 64%); text-align: center; font-size: .78rem; }

    dialog { width: min(34rem, calc(100% - 2rem)); border: 0; border-radius: 1.5rem; padding: 0; color: var(--ink); background: var(--cream); box-shadow: 0 32px 90px rgb(0 0 0 / 48%); }
    dialog::backdrop { background: rgb(30 5 9 / 72%); backdrop-filter: blur(5px); }
    .modal-art { position: relative; min-height: 8.5rem; padding: 1.3rem 1.4rem; overflow: hidden; color: white; background: linear-gradient(135deg, var(--cranberry-dark), var(--cranberry)); }
    .modal-art.gold { color: var(--wine-deep); background: linear-gradient(135deg, #e5b84e, #ffe7a4); }
    .modal-number { position: relative; z-index: 1; font-family: Georgia, serif; font-size: 4.6rem; line-height: 1; }
    .modal-label { position: relative; z-index: 1; display: block; margin-top: .3rem; font-size: .95rem; font-weight: 700; opacity: .85; }
    .modal-figure { position: absolute; right: 4.2rem; bottom: -.3rem; width: 8.5rem; height: 8.5rem; pointer-events: none; }
    .modal-figure svg { display: block; width: 100%; height: 100%; }
    .has-figure .modal-art { min-height: 10rem; }
    .lad-note { margin: 0 0 1.2rem; padding: .85rem 1rem; border-radius: .8rem; background: #f6e3dc; }
    .lad-note strong { display: block; margin-bottom: .2rem; color: var(--cranberry-dark); font-family: Georgia, serif; font-size: 1.15rem; font-weight: 500; }
    .modal-body .lad-note p { color: #5a3f3c; font-size: .98rem; line-height: 1.55; }
    .close-button { position: absolute; right: 1rem; top: 1rem; z-index: 4; display: grid; place-items: center; width: 2.6rem; height: 2.6rem; border: 1px solid rgb(255 255 255 / 38%); border-radius: 50%; color: inherit; background: rgb(255 255 255 / 14%); cursor: pointer; }
    .modal-body { padding: 1.6rem; }
    .content-type { display: inline-block; margin-bottom: .5rem; color: var(--cranberry); font-size: .95rem; font-weight: 800; }
    .modal-body h3 { margin: 0 0 .8rem; font-family: Georgia, serif; font-size: clamp(1.65rem, 6vw, 2.3rem); font-weight: 500; line-height: 1.1; }
    .modal-body p { margin: 0; color: #4d5b55; font-size: 1.05rem; line-height: 1.65; }
    .modal-action { margin-top: 1.25rem; border: 0; border-radius: 999px; padding: .8rem 1rem; color: white; background: var(--wine); font-weight: 800; cursor: pointer; }
    .modal-body .answer { margin-top: 1rem; padding: 1rem; border-left: 4px solid var(--gold); border-radius: .35rem; background: var(--paper); font-weight: 750; }
    .hidden { display: none !important; }
    .locked-dialog .modal-art { color: var(--ink); background: #ded7c9; }

    @media (min-width: 620px) {
      .site-shell { width: min(1160px, calc(100% - 3rem)); }
      .calendar-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .85rem; }
      .door { min-height: 9rem; }
      .door.special { grid-column: span 4; }
    }
    @media (min-width: 900px) {
      .calendar-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1rem; }
      .door { min-height: 10.2rem; }
      .door.special { grid-column: span 6; }
    }
    @media (max-width: 620px) {
      .topbar { align-items: flex-start; }
      .brand { font-size: 1.1rem; }
      .prototype-control { display: grid; grid-template-columns: repeat(3, 1fr); border-radius: 1rem; }
      .prototype-control span { grid-column: 1 / -1; text-align: center; }
      .prototype-control button { padding: .35rem .5rem; }
      .door .lad-name { font-size: .68rem; padding: .1rem .3rem; left: .4rem; bottom: .4rem; max-width: calc(100% - .8rem); }
      .door.has-name .art { bottom: 1.25rem; }
      .door .art { width: 54%; height: 62%; }
      .door.has-name .art { height: 56%; }
      .door .number { font-size: 2.1rem; }
      .door.special .number { font-size: 3rem; }
      .door.special .art { left: 44%; width: 6.5rem; }
      .door.special .special-copy { max-width: 6.5rem; font-size: .92rem; }
      .modal-figure { right: 3.6rem; width: 7.5rem; height: 7.5rem; }
      .calendar-head { align-items: flex-start; flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
      .door:hover:not(.locked) { transform: none; }
      .snowfall { display: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#calendar">Fara beint í dagatalið</a>
  <div class="snow" aria-hidden="true"></div>
  <div class="snowfall" id="snowfall" aria-hidden="true"></div>
  <div class="site-shell">
    <header class="topbar">
      <div class="brand"><svg class="brand-mark" viewBox="0 0 17 17" aria-hidden="true" focusable="false"><path d="M8.5 0 l2.6 6 6.4.4 -5 4 1.6 6.2 -5.6-3.4 -5.6 3.4 1.6-6.2 -5-4 6.4-.4z"/></svg><span>Jólagleði</span></div>
      <div class="prototype-control" aria-label="Veldu sýnidag frumgerðar">
        <span>Frumgerð</span>
        <button type="button" data-demo-day="1" aria-pressed="false">1.</button>
        <button type="button" data-demo-day="18" aria-pressed="true">18.</button>
        <button type="button" data-demo-day="24" aria-pressed="false">24.</button>
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">Desember 2026</p>
        <h1 id="page-title">Opnum jólin<br>einn dag í einu</h1>
        <p>Á bak við hvern glugga er eitthvað smátt fyrir starfsfólkið: gáta, málsháttur, lítil áskorun eða kveðja.</p>
        <button class="today-button" id="open-today" type="button">Opna glugga dagsins <span aria-hidden="true">→</span></button>
        <div class="landscape" aria-hidden="true">
        <svg class="village" viewBox="0 0 920 140" preserveAspectRatio="xMidYMax slice" focusable="false">
          <defs><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
          <path d="M0 140 C90 128 150 92 260 84 C360 77 420 94 470 92 C560 88 600 70 700 72 C800 74 860 110 920 140 Z" fill="#dcd3c0"/>
          <g><polygon points="194,92 205,58 216,92" fill="#1d4a3e"/><polygon points="199,77 205,58 211,77 205,73" fill="#fffaf0" opacity=".85"/><polygon points="224,90 232,64 240,90" fill="#2c5d4f"/><polygon points="227,78 232,64 237,78 232,76" fill="#fffaf0" opacity=".85"/><polygon points="171,100 178,78 185,100" fill="#2c5d4f"/><polygon points="174,90 178,78 182,90 178,88" fill="#fffaf0" opacity=".85"/><polygon points="659,80 668,50 677,80" fill="#1d4a3e"/><polygon points="662,66 668,50 674,66 668,64" fill="#fffaf0" opacity=".85"/><polygon points="688,78 700,40 712,78" fill="#123a31"/><polygon points="693,61 700,40 707,61 700,57" fill="#fffaf0" opacity=".85"/><polygon points="728,84 735,60 742,84" fill="#2c5d4f"/><polygon points="731,73 735,60 739,73 735,71" fill="#fffaf0" opacity=".85"/><polygon points="272,100 278,80 284,100" fill="#123a31"/><polygon points="274,91 278,80 282,91 278,89" fill="#fffaf0" opacity=".85"/><polygon points="633,100 640,78 647,100" fill="#123a31"/><polygon points="636,90 640,78 644,90 640,88" fill="#fffaf0" opacity=".85"/></g>
          <g><rect x="300" y="64" width="54" height="44" fill="#9d2933"/><polygon points="295,66 327,41 359,66" fill="#6f1821"/><rect x="338" y="39" width="7" height="15" fill="#8a5a46"/><rect x="337" y="36" width="9" height="4" rx="2" fill="#fffaf0"/><polyline points="296,64 327,40 358,64" fill="none" stroke="#fffaf0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect class="lit" x="310" y="75" width="8" height="10" rx="1.5"/><rect class="lit" x="336" y="75" width="8" height="10" rx="1.5"/><rect x="364" y="72" width="42" height="36" fill="#d9ae55"/><polygon points="359,74 385,54 411,74" fill="#a77d2c"/><polyline points="360,72 385,53 410,72" fill="none" stroke="#fffaf0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect class="lit" x="381" y="80" width="8" height="10" rx="1.5"/><rect x="434" y="40" width="20" height="32" fill="#f6efe1"/><polygon points="431,42 444,20 457,42" fill="#6f1821"/><polyline points="432,41 444,19 456,41" fill="none" stroke="#fffaf0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect class="lit" x="440" y="48" width="8" height="11" rx="4"/><path d="M444 6 l2.6 6 6.4.4 -5 4 1.6 6.2 -5.6-3.4 -5.6 3.4 1.6-6.2 -5-4 6.4-.4z" fill="#e6bd62"/><rect x="418" y="66" width="52" height="42" fill="#f6efe1"/><polygon points="413,68 444,44 475,68" fill="#6f1821"/><polyline points="414,66 444,43 474,66" fill="none" stroke="#fffaf0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect class="lit" x="440" y="76" width="8" height="10" rx="1.5"/><rect x="484" y="66" width="58" height="42" fill="#5f7d70"/><polygon points="479,68 513,42 547,68" fill="#3e5c50"/><rect x="497" y="39" width="7" height="15" fill="#8a5a46"/><rect x="496" y="36" width="9" height="4" rx="2" fill="#fffaf0"/><polyline points="480,66 513,41 546,66" fill="none" stroke="#fffaf0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect class="lit" x="494" y="76" width="8" height="10" rx="1.5"/><rect class="lit" x="524" y="76" width="8" height="10" rx="1.5"/><rect x="552" y="74" width="44" height="34" fill="#b04c3e"/><polygon points="547,76 574,56 601,76" fill="#75232c"/><polyline points="548,74 574,55 600,74" fill="none" stroke="#fffaf0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect class="lit" x="570" y="82" width="8" height="10" rx="1.5"/></g>
          <path d="M40 140 C120 124 200 102 300 98 C400 94 460 101 540 99 C640 96 740 100 820 118 C860 127 880 134 900 140 Z" fill="#f1eadb"/>
        </svg>
        </div>
      </section>

      <section class="calendar-card" id="calendar" aria-labelledby="calendar-title">
        <div class="calendar-head">
          <div>
            <h2 id="calendar-title">Jóladagatalið</h2>
            <p id="calendar-subtitle">Sýnidagur: 18. desember</p>
          </div>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
      </section>
    </main>

    <footer class="footer">Frumgerð. Efnið er sýnishorn og dagurinn er valinn efst á síðunni.</footer>
  </div>

  <dialog id="day-dialog" aria-labelledby="dialog-title">
    <div class="modal-art" id="modal-art">
      <button class="close-button" id="close-dialog" type="button" aria-label="Loka glugga">✕</button>
      <span class="modal-number" id="modal-number"></span>
      <span class="modal-label" id="modal-date"></span>
      <div class="modal-figure" id="modal-figure"></div>
    </div>
    <div class="modal-body">
      <div class="lad-note hidden" id="lad-note"><strong id="lad-title"></strong><p id="lad-about"></p></div>
      <span class="content-type" id="content-type"></span>
      <h3 id="dialog-title"></h3>
      <p id="dialog-copy"></p>
      <button class="modal-action hidden" id="modal-action" type="button"></button>
      <p class="answer hidden" id="answer" role="status"></p>
    </div>
  </dialog>

  <script>
    const content = [
      { type: "Velkomin", title: "Desember er genginn í garð", copy: "Fyrsti glugginn af 24. Við byrjum á gömlum og góðum málshætti: Margar hendur vinna létt verk." },
      { type: "Desemberspeki", title: "Leyfileg desemberregla", copy: "Það sem ekki klárast fyrir jól getur stundum beðið þar til eftir smákökuna." },
      { type: "Áskorun dagsins", title: "Lítið takk", copy: "Þakkaðu samstarfsfélaga fyrir eitthvað lítið sem gerði daginn þinn betri. Ein setning er nóg." },

          <path d="M-9 14 L-10 -6 Q-10 -22 0 -22 Q10 -22 10 -6 L9 14 Z" fill="${color}"/>
          <path d="M-7 -4 l3.5 -4 l3.5 4 l3.5 -4 l3.5 4" fill="none" stroke="${band}" stroke-width="2"/>
          <circle cx="-3.5" cy="-14" r="1.3" fill="${band}" stroke="none"/><circle cx="3.5" cy="-14" r="1.3" fill="${band}" stroke="none"/>
          <rect x="-10.5" y="9" width="21" height="8" rx="1.5" fill="${band}"/>
        </g>`;
        return svgArt(`<path d="M4 22 Q50 30 96 22" fill="none" stroke="${C.white}" stroke-width="2"/>
          ${mitten(32, 52, C.cap, C.white, -6)}${mitten(68, 54, C.white, C.cap, 8)}
          <rect x="30" y="22" width="5" height="11" rx="1" fill="${C.wood}" stroke-width="1.6"/><rect x="67" y="23" width="5" height="11" rx="1" fill="${C.wood}" stroke-width="1.6"/>`);
      },
      piparkaka: () => svgArt(`
        <path d="M50 90 C20 70 18 42 36 38 C45 36 50 43 50 48 C50 43 55 36 64 38 C82 42 80 70 50 90 Z" fill="#b26a32"/>
        <circle cx="50" cy="51.5" r="2.4" fill="#5a2e12" stroke-width="1.4"/>
        <path d="M50 4 V20 M50 22 Q44 36 48.6 51 M50 22 Q56 36 51.4 51" fill="none" stroke="${INK}" stroke-width="4.6"/>
        <path d="M50 4 V20 M50 22 Q44 36 48.6 51 M50 22 Q56 36 51.4 51" fill="none" stroke="${C.cap}" stroke-width="2.2"/>
        <path d="M50 21 c-8 -6 -10 2 0 2 c10 0 8 -8 0 -2 z" fill="${C.cap}" stroke-width="1.6"/>
        <path d="M50 82 C28 67 27 47 38 45 C44 44 48 49 50 54 C52 49 56 44 62 45 C73 47 72 67 50 82 Z" fill="none" stroke="${C.white}" stroke-width="2.4" stroke-dasharray="0.1 4.4"/>
        <circle cx="43" cy="60" r="2.4" fill="${C.white}" stroke="none"/><circle cx="57" cy="60" r="2.4" fill="${C.white}" stroke="none"/>
        <path d="M43 68 Q50 74 57 68" fill="none" stroke="${C.white}" stroke-width="2.4"/>`),
      kottur: () => svgArt(`
        ${limb("M66 86 Q90 82 86 60 Q84 52 77 56", "#3a3035", 5)}
        <path d="M30 92 Q26 58 44 52 Q50 50 56 52 Q74 58 70 92 Z" fill="#3a3035"/>
        <path d="M36 34 L34 16 L46 27 Z M64 34 L66 16 L54 27 Z" fill="#3a3035"/>
        <ellipse cx="50" cy="40" rx="17" ry="15" fill="#3a3035"/>
        <path d="M37 32 L36 22 L43 28 Z M63 32 L64 22 L57 28 Z" fill="#b5838a" stroke="none"/>
        <ellipse cx="43" cy="38" rx="4.4" ry="4" fill="#f2c641"/><ellipse cx="57" cy="38" rx="4.4" ry="4" fill="#f2c641"/>
        <path d="M43 35 V41 M57 35 V41" stroke-width="2"/>
        <path d="M48 45 h4 l-2 2.4 z" fill="#d98b99" stroke-width="1.2"/>
        <path d="M44 47 L31 45 M44 49 L32 52 M56 47 L69 45 M56 49 L68 52" fill="none" stroke="${C.white}" stroke-width="1"/>
        <path d="M36 54 Q50 62 64 54" fill="none" stroke="${C.cap}" stroke-width="4"/>
        <ellipse cx="42" cy="91" rx="6" ry="3" fill="#3a3035"/><ellipse cx="58" cy="91" rx="6" ry="3" fill="#3a3035"/>`)
    };

    const lads = {
      12: { art: "stekkjastaur", name: "Stekkjastaur", about: "Hann er staurfættur og stirður til gangs, og laumast í fjárhúsin til að sjúga ærnar." },
      13: { art: "giljagaur", name: "Giljagaur", about: "Hann felur sig í giljum og skýst inn í fjósið til að fleyta froðuna ofan af mjólkurfötunum." },
      14: { art: "stufur", name: "Stúfur", about: "Hann er minnstur bræðranna og kroppar viðbrenndar agnir af pönnunum." },
      15: { art: "thvorusleikir", name: "Þvörusleikir", about: "Hann er grannur eins og þvaran sem hann sleikir þegar enginn sér til." },
      16: { art: "pottaskefill", name: "Pottaskefill", about: "Hann skefur skófirnar innan úr pottunum áður en nokkur nær að vaska upp." },
      17: { art: "askasleikir", name: "Askasleikir", about: "Hann felur sig undir rúmi og sleikir askana sem fólk setur á gólfið." },
      18: { art: "hurdaskellir", name: "Hurðaskellir", about: "Hann skellir hurðum um miðjar nætur svo enginn fær frið til að sofa." },
      19: { art: "skyrgamur", name: "Skyrgámur", about: "Hann brýtur lokið af skyrtunnunni og hámar í sig skyrið." },
      20: { art: "bjugnakraekir", name: "Bjúgnakrækir", about: "Hann situr uppi í rjáfrinu og krækir sér í bjúgu sem hanga þar í reyk." },
      21: { art: "gluggagaegir", name: "Gluggagægir", about: "Hann gægist inn um gluggana til að sjá hvað hann getur nælt sér í." },
      22: { art: "gattathefur", name: "Gáttaþefur", about: "Hann er með risastórt nef og finnur ilminn af laufabrauðinu langar leiðir." },
      23: { art: "ketkrokur", name: "Ketkrókur", about: "Hann rennir krók niður um strompinn og krækir sér í hangikjötið." },
      24: { art: "kertasnikir", name: "Kertasníkir", about: "Hann kemur síðastur og eltir börnin til að ná sér í kerti." }
    };
    const decorations = { 2: "mus", 3: "vettlingar", 6: "tre", 9: "piparkaka", 11: "kottur" };
    const artFor = day => lads[day]?.art || decorations[day];

    const grid = document.querySelector("#calendar-grid");
    const dialog = document.querySelector("#day-dialog");
    const subtitle = document.querySelector("#calendar-subtitle");
    const openToday = document.querySelector("#open-today");
    const demoButtons = [...document.querySelectorAll("[data-demo-day]")];
    let demoDay = 18;
    let lastDay = null;
    const lockIcon = '<svg viewBox="0 0 16 16" focusable="false"><path d="M4.5 7V5a3.5 3.5 0 0 1 7 0v2h.5a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1zm1.6 0h3.8V5a1.9 1.9 0 0 0-3.8 0z"/></svg>';

    function doorLabel(day, locked, opened) {
      const lad = lads[day] ? `, ${lads[day].name} kemur` : "";
      if (locked) return `${day}. desember${lad}, læstur, opnast ${day}. desember`;
      if (day === demoDay) return `${day}. desember${lad}, í dag, opna glugga`;
      return `${day}. desember${lad}, ${opened ? "skoðaður" : "tilbúinn"}, opna glugga`;
    }

    function readOpened() {
      try { return JSON.parse(localStorage.getItem("jolagledi-opened") || "[]"); }
      catch { return []; }
    }

    function markOpened(day) {
      const opened = new Set(readOpened());
      opened.add(day);
      try { localStorage.setItem("jolagledi-opened", JSON.stringify([...opened])); } catch {}
    }

    function renderCalendar() {
      const opened = new Set(readOpened());
      grid.innerHTML = "";
      subtitle.textContent = `Sýnidagur: ${demoDay}. desember`;
      demoButtons.forEach(button => button.setAttribute("aria-pressed", String(Number(button.dataset.demoDay) === demoDay)));

      content.forEach((item, index) => {
        const day = index + 1;
        const locked = day > demoDay;
        const button = document.createElement("button");
        button.type = "button";
        const isToday = day === demoDay;
        const lad = lads[day];
        const drawing = artFor(day);
        button.className = `door${locked ? " locked" : ""}${isToday ? " is-today" : ""}${day === 24 ? " special" : ""}${lad ? " has-name" : ""}`;
        button.dataset.day = day;
        button.setAttribute("aria-label", doorLabel(day, locked, opened.has(day)));
        button.innerHTML = `
          ${drawing ? `<span class="art" aria-hidden="true">${art[drawing]()}</span>` : ""}
          ${isToday ? "" : locked ? `<span class="status" aria-hidden="true">${lockIcon}</span>` : opened.has(day) ? '<span class="status" aria-hidden="true">✓</span>' : ""}
          <span class="number">${day}</span>
          ${lad ? `<span class="lad-name" aria-hidden="true">${lad.name}</span>` : ""}
          ${isToday ? '<span class="today-tag">Í dag</span>' : ""}
          ${day === 24 ? '<span class="special-copy">Sérstök jólakveðja á aðfangadag</span>' : ""}
        `;
        button.addEventListener("click", () => openDoor(day));
        grid.append(button);
      });
    }

    function openDoor(day) {
      const locked = day > demoDay;
      const item = content[day - 1];
      lastDay = day;
      dialog.classList.toggle("locked-dialog", locked);
      document.querySelector("#modal-art").classList.toggle("gold", day === 24 && !locked);
      document.querySelector("#modal-number").textContent = day;
      const lad = lads[day];
      const drawing = artFor(day);
      document.querySelector("#modal-date").textContent = lad && !locked ? `${day}. desember · ${lad.name}` : `${day}. desember`;
      document.querySelector("#modal-figure").innerHTML = drawing && !locked ? art[drawing]() : "";
      dialog.classList.toggle("has-figure", Boolean(drawing && !locked));
      document.querySelector("#lad-note").classList.toggle("hidden", !lad || locked);
      if (lad && !locked) {
        document.querySelector("#lad-title").textContent = `${lad.name} kom til byggða í nótt`;
        document.querySelector("#lad-about").textContent = lad.about;
      }
      document.querySelector("#content-type").textContent = locked ? "Enn læst" : item.type;
      document.querySelector("#dialog-title").textContent = locked ? "Þessi gluggi bíður aðeins" : item.title;
      document.querySelector("#dialog-copy").textContent = locked ? `Glugginn opnast ${day}. desember. Þangað til fær leyndarmálið að vera í friði.` : item.copy;

      const action = document.querySelector("#modal-action");
      const answer = document.querySelector("#answer");
      action.classList.toggle("hidden", locked || !item.action);
      answer.classList.add("hidden");
      if (!locked && item.action) {
        action.textContent = item.action;
        action.onclick = () => {
          answer.textContent = item.answer;
          answer.classList.remove("hidden");
          action.classList.add("hidden");
        };
      }

      if (!locked) { markOpened(day); renderCalendar(); }
      dialog.showModal();
    }

    document.querySelector("#close-dialog").addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", event => {
      const bounds = dialog.getBoundingClientRect();
      if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) dialog.close();
    });
    // Glugginn er teiknaður upp á nýtt þegar hann er opnaður, svo fókus fer á nýja hnappinn.
    dialog.addEventListener("close", () => document.querySelector(`[data-day="${lastDay}"]`)?.focus());
    openToday.addEventListener("click", () => document.querySelector(`[data-day="${demoDay}"]`)?.click());
    demoButtons.forEach(button => button.addEventListener("click", () => { demoDay = Number(button.dataset.demoDay); renderCalendar(); }));

    function letItSnow() {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const box = document.querySelector("#snowfall");
      const crystal = '<svg viewBox="0 0 20 20" focusable="false"><path d="M10 1v18M2.2 5.5l15.6 9M2.2 14.5l15.6-9M10 4l-2-2M10 4l2-2M10 16l-2 2M10 16l2 2"/></svg>';
      const count = innerWidth < 620 ? 28 : 55;
      const rand = (a, b) => a + Math.random() * (b - a);
      for (let i = 0; i < count; i++) {
        const flake = document.createElement("span");
        const isCrystal = i % 9 === 0;
        const size = isCrystal ? rand(10, 16) : rand(2, 6.5);
        flake.className = `flake${isCrystal ? " crystal" : ""}`;
        if (isCrystal) flake.innerHTML = crystal;
        const dur = rand(11, 24) * (isCrystal ? 1.2 : 1) * (size < 3.5 ? 1.3 : 1);
        flake.style.cssText = `--x:${rand(-2, 100)}%;--size:${size}px;--alpha:${rand(.45, .9).toFixed(2)};--dur:${dur.toFixed(1)}s;--delay:${(-rand(0, dur)).toFixed(1)}s;--drift:${rand(-40, 40).toFixed(0)}px;${size > 5.5 && !isCrystal ? "--blur:1px;" : ""}`;
        box.append(flake);
      }
    }

    renderCalendar();
    letItSnow();
  </script>
</body>
</html>
