name: Birta á GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default: read-only. The deploy job asks for the extra Pages permissions it needs.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a running Pages deployment; superseded PR runs can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Undirbúa síðu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check index.html
        run: |
          test -f index.html
          grep -qi '<meta charset="utf-8">' index.html
          grep -qi 'name="viewport"' index.html

      - name: Collect site files
        run: |
          mkdir _site
          cp index.html _site/

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Birta
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
